<!doctype html><meta charset="utf-8"><title>存档事务验证</title><pre id="result">运行中</pre><script type="module">
import * as E from '../../src/engine.js';import * as W from '../../src/world.js';import {RegionRepository,RegionGameStore} from '../../src/region-store.js';
const lines=[],ok=(v,m)=>{if(!v)throw Error(m);lines.push('PASS '+m);},reject=async(fn,m)=>{let failed=false;try{await fn();}catch{failed=true;}ok(failed,m);};
try{
 const ns='slots-qa-'+Date.now(),repo=new RegionRepository(),store=new RegionGameStore(localStorage,ns,repo);await store.switch('a');await store.run(()=>{const spec=W.regionSpec({seed:'slots27',theme:'wild',atlas:{regions:{}}},0,0,'small'),raw=W.demoRegion(spec),s=E.newGame(raw,{mode:'demo',seed:'slots27'});s.world=W.validateRegion(raw,spec);return s;},{create:true});let rows=await store.listSnapshots();ok(rows.filter(r=>r.slot.startsWith('auto')).length===1,'创建游戏自动保存');
 await store.saveSnapshot('manual-1','初始营地');const slot=(await store.listSnapshots()).find(r=>r.slot==='manual-1'),initial=store.state.bag.wood;
 for(let i=0;i<4;i++)await store.run(s=>{E.tick(s,30,0);s.bag.wood=initial+i+1;});rows=await store.listSnapshots();ok(rows.filter(r=>r.slot.startsWith('auto')).length===3,'自动存档只轮换三个槽');ok(rows.find(r=>r.slot==='manual-1').token===slot.token,'自动存档不覆盖手动槽');
 const travel=async(x,y)=>store.run(async(s,signal,tx)=>{const plan=W.travelPlan(s,x,y),from=W.regionKey(s);let data=await tx.loadRegion(s,x,y);if(!data){const spec=W.regionSpec(s,x,y,'small');data={world:W.validateRegion(W.demoRegion(spec),spec),locals:{},clues:[],sync:{}};}tx.stageRegion(from,W.installRegion(s,x,y,data,plan));});
 await travel(1,0);await store.saveSnapshot('manual-2','两个区域');const two=(await store.listSnapshots()).find(r=>r.slot==='manual-2');await store.run(s=>{s.world.cells['4,4'].name='后来的改变';});await travel(0,0);await store.run(s=>{s.world.cells['4,4'].name='旧区后来改变';});
 await store.loadSnapshot('manual-2',two.token);ok(Object.keys(store.state.atlas.regions).length===2&&store.state.atlas.x===1,'读取完整跨区域世界');ok(store.state.world.cells['4,4'].name!=='后来的改变','当前区域回退');await travel(0,0);ok(store.state.world.cells['4,4'].name!=='旧区后来改变','异地区域也回退');
 const preLoad=await store.export();await store.loadSnapshot('manual-1',slot.token);ok(store.state.bag.wood===initial&&Object.keys(store.state.atlas.regions).length===1,'早期存档恢复物资与世界范围');const backup=(await store.listSnapshots()).find(r=>r.slot==='before-load');const backed=await repo.readSnapshot(store.key(),'before-load',backup.token);ok(JSON.stringify(backed.bundle)===JSON.stringify(JSON.parse(preLoad)),'读取前备份是完整原进度');
 const current=await store.export();await reject(()=>store.saveSnapshot('manual-1','过期覆盖','wrong-token'),'过期槽位令牌拒绝覆盖');ok(await store.export()===current,'拒绝覆盖不修改当前存档');
 const other=new RegionGameStore(localStorage,ns,repo);await other.switch('a');await store.run(s=>{s.bag.wood++;});await reject(()=>other.saveSnapshot('manual-3','过期窗口'),'跨窗口旧进度不能保存');
 await store.switch('b');ok((await store.listSnapshots()).length===0,'聊天存档槽隔离');await store.switch('a');
 let unblock;const originalRead=repo.readSnapshot.bind(repo);repo.readSnapshot=async(...args)=>{await new Promise(r=>unblock=r);return originalRead(...args);};const pending=store.loadSnapshot('manual-1',slot.token);await store.switch('b');unblock();await reject(()=>pending,'切换聊天中断迟到读档');ok(store.state===null,'迟到读档不写入新聊天');repo.readSnapshot=originalRead;
 await store.switch('a');const originalCommit=repo.commit.bind(repo);repo.commit=async()=>{throw Error('quota');};const before=await store.export();await reject(()=>store.saveSnapshot('manual-4','失败'),'写入失败报告错误');ok(before===await store.export(),'写入失败保留当前进度');repo.commit=originalCommit;
 const result=await store.listSnapshots();ok(!result.some(r=>r.slot==='manual-4'),'失败存档不生成假槽位');
 const beforeAbort=await store.export(),put=IDBObjectStore.prototype.put;IDBObjectStore.prototype.put=function(value,key){if(this.name==='snapshots'&&key?.[1]==='manual-5')throw new DOMException('quota','QuotaExceededError');return put.call(this,value,key);};try{await reject(()=>store.saveSnapshot('manual-5','事务中途失败'),'快照写入中途失败会终止事务');}finally{IDBObjectStore.prototype.put=put;}ok(beforeAbort===await store.export(),'事务中途失败连同当前进度一起回滚');
 const migrationName='migration-slots-'+Date.now(),bundle=JSON.parse(beforeAbort),key=store.key();await new Promise((resolve,reject)=>{const r=indexedDB.open(migrationName,1);r.onupgradeneeded=()=>{r.result.createObjectStore('heads');r.result.createObjectStore('regions');};r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction(['heads','regions'],'readwrite'),h=structuredClone(bundle.state);for(const field of ['world','locals','clues','sync'])delete h[field];tx.objectStore('heads').put(h,key);for(const[c,r]of Object.entries(bundle.regions))tx.objectStore('regions').put(r,[key,h.id,c]);tx.oncomplete=()=>{db.close();resolve();};tx.onabort=()=>reject(tx.error);};});const migrated=new RegionRepository({open:(_,v)=>indexedDB.open(migrationName,v)});ok((await migrated.load(key)).id===bundle.state.id,'旧版数据库升级保留游戏');ok((await migrated.listSnapshots(key)).length===0,'旧版升级新增空存档槽');
}catch(e){lines.push('FAIL '+e.stack);}document.querySelector('#result').textContent=lines.join('\n');
</script>
